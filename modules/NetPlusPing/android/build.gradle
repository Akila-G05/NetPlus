apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.netplusping'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir, "expo-modules-core-plugin.gradle")
if (expoModulesCorePlugin.exists()) {
  apply from: expoModulesCorePlugin
}

android {
  namespace "expo.modules.netplusping"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  lintOptions {
    abortOnError false
  }

  publishing {
    singleVariant("release")
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android"
  implementation "androidx.core:core-ktx"
  // Cronet-embedded: Chromium network stack (BoringSSL + Chrome-like TLS profile).
  // Replaces Conscrypt HttpURLConnection for the HTTP probe so WAF-backed targets
  // (e.g. oneapp.hutch.lk) get the same allowlisted handshake as Z-Pinger's dart:io.
  implementation "org.chromium.net:cronet-embedded:143.7445.0"
}
